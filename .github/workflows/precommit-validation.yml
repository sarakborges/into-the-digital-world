name: Precommit validation

on:
  pull_request:
    branches:
      - codex/map-and-parameter-cleanup

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit battle settlement
        run: |
          test ! -e src/Helpers/Systems/Battle/triggerVictory.helper.ts
          test ! -e src/Helpers/Systems/Battle/triggerDefeat.helper.ts
          test ! -e src/Helpers/Systems/Dungeon/enterNextDungeonRoom.helper.ts
          grep -q "settleBattle" src/GameData/Scenes/Apps/Battle/BattleEnd.scene.tsx
          grep -q "BattleEnd" src/Helpers/Systems/Data/restoreGameSession.helper.ts
          grep -q "Active battle sessions cannot contain loot" src/Systems/Save/Session.schema.ts
          grep -q "return 'invalid'" src/Helpers/Systems/Battle/getBattleResult.helper.ts
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit 2>&1 | tee tsc-errors.txt
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsc-errors
          path: tsc-errors.txt
      - name: Build
        run: npm run build
