name: Precommit validation

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit room ownership
        run: |
          ! grep -R "isLastRoom" src/Components/Main/Dungeon src/Helpers/Systems/Dungeon
          ! test -f src/GameData/Dungeons/WildZone/KoromonNest/Rooms/Boss.ts
          grep -q "choices:" src/GameData/Dungeons/WildZone/KoromonNest/Rooms/Boss/index.ts
          grep -q "event: leaveDungeon" src/GameData/Dungeons/WildZone/KoromonNest/Rooms/Boss/index.ts
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
