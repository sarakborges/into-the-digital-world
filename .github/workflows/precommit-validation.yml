name: Precommit validation

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dungeon room flow
        run: |
          grep -q "room.type === 'event'" src/Components/Main/Dungeon/Dungeon.component.tsx
          grep -q "component: DungeonRoom" src/GameData/Scenes/Apps/Battle/BattleEnd.scene.tsx
          grep -q "settleDungeonRoom" src/GameData/Scenes/Apps/Dungeon/Room.scene.tsx
          grep -q "currentRoomsOptions.length" src/Helpers/Systems/Data/restoreGameSession.helper.ts

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
